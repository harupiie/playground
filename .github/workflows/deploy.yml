name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 8 * * *'  # 毎日 UTC 8:00 (JST 17:00 / US Pacific 0:00)
  push:
    branches: [feature/ai-tech-feeds]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      # globalSetup が articles.json をフィクスチャに差し替えてビルドするため、
      # CI フラグを渡すだけで本番データを汚さずに E2E を実行できる。
      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium

      - name: E2E テストを実行
        run: pnpm test:e2e

  build-and-deploy:
    needs: e2e
    if: always() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - name: 記事データを更新
        run: pnpm update-feeds
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: 更新された記事データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json
          git diff --staged --quiet || (git commit -m "chore: 記事データを更新" && git push)

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4

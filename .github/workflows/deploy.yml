name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 8 * * *'  # 毎日 UTC 8:00 (JST 17:00 / US Pacific 0:00)
  push:
    branches: [feature/ai-tech-feeds]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - run: pnpm install

      - name: 記事データを更新
        run: pnpm update-feeds
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: 更新された記事データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json
          git diff --staged --quiet || (git commit -m "chore: 記事データを更新" && git push)

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
